name: CI

'on':
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend_tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-test.txt

      - name: Run Linux installer tests with polluted runner XDG environment
        run: |
          mkdir -p "$RUNNER_TEMP/outer-xdg-config" "$RUNNER_TEMP/outer-xdg-data"
          CI=true \
          XDG_CONFIG_HOME="$RUNNER_TEMP/outer-xdg-config" \
          XDG_DATA_HOME="$RUNNER_TEMP/outer-xdg-data" \
          ELVERN_INSTALL_TEST_FAIL_AT="outside-fixture" \
          python -m pytest backend/tests/test_desktop_helper_linux_installer.py -q

      - name: Run backend tests
        run: python -m pytest

  desktop_helper_tests:
    name: Desktop helper tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Show .NET environment
        run: |
          dotnet --info
          dotnet --list-sdks
          dotnet --version

      - name: Build desktop helper
        run: dotnet build clients/desktop-vlc-opener/Elvern.VlcOpener.csproj --configuration Release

      - name: Test desktop helper
        run: dotnet test clients/desktop-vlc-opener/Tests/Elvern.VlcOpener.Tests.csproj --configuration Release

  frontend_tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  security_audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pip-audit and bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit "bandit[toml]"

      - name: Run pip-audit on backend dependencies
        run: pip-audit -r backend/requirements.txt --strict

      - name: Run pip-audit on test dependencies
        run: pip-audit -r backend/requirements-test.txt --strict

      - name: Run bandit on backend source
        run: bandit -r backend/app -ll -ii --exclude backend/app/__pycache__

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Run npm audit (high severity)
        working-directory: frontend
        run: npm audit --audit-level=high

  docker_smoke:
    name: Production Docker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run production Docker smoke
        run: ./scripts/docker-smoke.sh

  production_browser_tests:
    name: Production Chromium and Firefox
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Read locked Playwright version
        id: playwright-version
        working-directory: frontend
        run: echo "version=$(node -p 'require("./node_modules/@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}-${{ steps.playwright-version.outputs.version }}

      - name: Install matching Chromium and Firefox
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox

      - name: Build production frontend
        working-directory: frontend
        run: node scripts/build-phase7-production.mjs

      - name: Run isolated production browser regression
        working-directory: frontend
        run: >-
          node scripts/run-cross-browser-playwright.mjs
          --use-existing-build
          --project chromium-desktop-production
          --project firefox-desktop-production
          --project chromium-assistant-navigation
          --project firefox-assistant-navigation
          --project chromium-settings-navigation
          --project firefox-settings-navigation
          --project chromium-service-worker-network-guard
          --project firefox-service-worker-network-guard
          --project chromium-wss-network-guard
          --project firefox-wss-network-guard

      - name: Upload sanitized browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-failure-${{ github.run_id }}
          path: tmp/playwright-phase7-*
          if-no-files-found: warn
          retention-days: 7
